<style>
  :root { --pop: #F08A24; --pop-deep: #B4530F; }
  body { min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg, #FBF6EC); }
  .lk-box {
    width: min(380px, 100%); padding: 36px 28px 30px; border-radius: 16px; text-align: center;
    background: var(--paper, #fff); border: 1px solid var(--line-soft, #e8e0d0);
    box-shadow: 0 24px 60px -16px rgba(27, 26, 24, .18);
  }
  .lk-box img { width: 44px; height: 44px; }
  .lk-box h1 { margin: 12px 0 4px; font-size: 24px; }
  .lk-box h1 em { font-style: normal; color: var(--pop-deep); }
  .lk-box p { margin: 0 0 22px; font-size: 14px; color: var(--ink-soft, #5a554c); line-height: 1.6; }
  .lk-dots { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; }
  .lk-dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line, #d6ccb8); transition: .15s; }
  .lk-dots i.on { background: var(--pop); border-color: var(--pop); }
  .lk-dots.err i { border-color: #c0392b; background: transparent; }
  #pin {
    width: 100%; box-sizing: border-box; padding: 13px 14px; border-radius: 10px; font-size: 20px; letter-spacing: 8px; text-align: center;
    border: 1px solid var(--line, #d6ccb8); font-family: 'JetBrains Mono', monospace;
  }
  #pin:focus { outline: 2px solid var(--pop); outline-offset: 1px; }
  #go {
    width: 100%; margin-top: 12px; padding: 13px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--pop); color: #1b1a18; font-size: 15px; font-weight: 700; font-family: 'Pretendard', sans-serif;
  }
  #go:disabled { opacity: .55; cursor: default; }
  #msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: #c0392b; }
  .lk-back { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--ink-label, #8a8377); }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .shake { animation: shake .38s ease; }
</style>

  var RL = 'kja_jogak_lock_rl', MAX = 5, LOCK_MIN = 5;
  var pin = document.getElementById('pin'), go = document.getElementById('go'),
      msg = document.getElementById('msg'), dots = document.getElementById('dots'), box = document.getElementById('lk');
  var bytes = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var rl = function () { try { return JSON.parse(localStorage.getItem(RL) || '{"n":0,"until":0}'); } catch (e) { return { n: 0, until: 0 }; } };
  var setRl = function (o) { try { localStorage.setItem(RL, JSON.stringify(o)); } catch (e) {} };

  function paint() {
    var v = pin.value;
    dots.classList.remove('err');
    [].forEach.call(dots.children, function (d, i) { d.classList.toggle('on', i < v.length); });
  }
  function locked() {
    var r = rl(), rem = Math.ceil((r.until - Date.now()) / 1000);
    if (rem <= 0) return false;
    msg.textContent = '⏳ ' + Math.floor(rem / 60) + '분 ' + (rem % 60) + '초 뒤에 다시 넣을 수 있어요.';
    go.disabled = pin.disabled = true;
    setTimeout(function () { if (!locked()) { go.disabled = pin.disabled = false; msg.textContent = ''; setRl({ n: 0, until: 0 }); } }, 1000);
    return true;
  }

  async function open(code) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(DATA));
    return new TextDecoder().decode(plain);
  }

  async function tryOpen() {
    if (locked()) return;
    var code = pin.value.replace(/\D/g, '');
    if (code.length !== 6) { msg.textContent = '숫자 6자리를 넣어 주세요.'; return; }
    go.disabled = true; msg.style.color = 'var(--ink-label, #8a8377)'; msg.textContent = '여는 중…';
    try {
      var html = await open(code);
      setRl({ n: 0, until: 0 });
      try { sessionStorage.setItem('kja_jogak_lock_pin', code); } catch (e) {}
      document.open(); document.write(html); document.close();
    } catch (e) {
      var r = rl(); r.n++;
      if (r.n >= MAX) r.until = Date.now() + LOCK_MIN * 60000;
      setRl(r);
      msg.style.color = '';
      msg.textContent = '비밀번호가 맞지 않아요. (남은 기회 ' + Math.max(0, MAX - r.n) + '번)';
      pin.value = ''; paint(); dots.classList.add('err');
      box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      go.disabled = false; locked(); pin.focus();
    }
  }

  pin.addEventListener('input', function () {
    pin.value = pin.value.replace(/\D/g, '').slice(0, 6); paint(); msg.textContent = '';
    if (pin.value.length === 6) tryOpen();
  });
  box.addEventListener('submit', function (e) { e.preventDefault(); tryOpen(); });
  locked();
  // 같은 창에서 새로 고침하면 다시 묻지 않음 (창을 닫으면 다시 물어봄)
  try { var saved = sessionStorage.getItem('kja_jogak_lock_pin'); if (saved) { pin.value = saved; paint(); tryOpen(); } } catch (e) {}
})();
